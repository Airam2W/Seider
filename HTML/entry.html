<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titles.entry">Seider - Entry</title>

    <link rel="stylesheet" href="/CSS/styles.css">
    <link rel="stylesheet" href="/CSS/entry.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="/IMG/logo.png">
</head>

<body>

    <div class="content-container">

        <!-- LOADING OVERLAY -->

        <div id="loadingOverlay" class="loading-overlay">

            <div class="loading-box">

                <div class="loading-spinner"></div>

                <h2 data-i18n="common.loading">
                    Loading...
                </h2>

                <div class="loading-dots">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </div>

        <!-- REAL CONTENT -->

        <main class="entry-container content">

            <div id="entryDateContainer" class="entry-date-box">
                <span id="entryDateLabel" data-i18n="labels.date">Date:</span>
                <span id="entryDateValue">--</span>
            </div>

            <!-- ITEMS TABLE -->
            <div id="itemsContainer">
            </div>

            <button id="btnAddGroup" data-i18n="buttons.addCategory">+ Add Category</button>

            <!-- NEW TAG MODAL -->
            <div id="newTagModal" class="modal hidden">
                <div class="modal-content">
                    <h3 data-i18n="labels.newTag">Create New Tag</h3>
                    <input id="newTagName" type="text" placeholder="Tag name"
                        data-i18n-placeholder="placeholders.tagName">
                    <div class="modal-actions">
                        <button id="btnCreateTag" data-i18n="buttons.create">Create</button>
                        <button id="btnCancelTag" data-i18n="buttons.cancelTag">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- NEW SUBTAG MODAL -->
            <div id="newSubtagModal" class="modal hidden">
                <div class="modal-content">
                    <h3 data-i18n="labels.newSubtag">Create New Subtag</h3>
                    <input id="newSubtagName" type="text" placeholder="Subtag name"
                        data-i18n-placeholder="placeholders.subtagName">
                    <div class="modal-actions">
                        <button id="btnCreateSubtag" data-i18n="buttons.create">Create</button>
                        <button id="btnCancelSubtag" data-i18n="buttons.cancelTag">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- TOTAL -->
            <div class="total-box">
                <span id="totalAmount" data-i18n="timeline.totalWaiting">Total: Waiting...</span>
            </div>

            <br>

            <!-- NOTES -->
            <div id="editor"></div>



            <!-- ACTIONS -->
            <div class="actions">
                <button id="btnSave" data-i18n="entry.save">Save</button>
                <button id="btnCancel" data-i18n="common.back">Back</button>
            </div>



            <!-- SIDE BUTTONS LEFT -->
            <div class="side-buttons-left">
                <button id="darkModeToggle" class="toggle-btn" data-i18n="common.darkMode">Dark Mode</button>
            </div>

            <script>
                if (localStorage.getItem("darkMode") === "true") {
                    document.documentElement.classList.add("dark-mode");
                }
            </script>

            <!-- CUSTOM ALERT/CONFIRM-->
            <div id="customModalOverlay" class="custom-modal-overlay">

                <div class="custom-modal">

                    <div class="custom-modal-header">

                        <div id="customModalIcon" class="custom-modal-icon">
                            ⚡
                        </div>

                        <div id="customModalTitle" class="custom-modal-title">
                            Alert
                        </div>

                    </div>

                    <div id="customModalMessage" class="custom-modal-message">
                        Message here...
                    </div>

                    <div class="custom-modal-actions">

                        <button id="customModalCancel" class="custom-modal-btn cancel">
                            Cancel
                        </button>

                        <button id="customModalConfirm" class="custom-modal-btn confirm">
                            OK
                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.js"></script>
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script type="module" src="/JS/entry.js"></script>
    <script type="module" src="/JS/auth-guard.js"></script>
</body>

</html>
