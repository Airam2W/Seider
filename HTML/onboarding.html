<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title data-i18n="titles.onboarding">Seider - Welcome</title>


<link rel="stylesheet" href="../CSS/onboarding.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/Seider/IMG/logo.png">
</head>

<body>



    <div class="background-glow"></div>



    <div class="onboarding-container">

        <!-- TOP -->
        <div class="top-section">

            <h1 data-i18n="onboarding.welcome">Welcome to Seider</h1>

            <p data-i18n="onboarding.subtitle">
                Let's personalize your experience
            </p>

            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

        <!-- CARD -->
        <div class="card">

            <!-- STEP 1 -->
            <div class="step active" id="step-1">

                <h2 data-i18n="onboarding.tellUsAboutYourself">Tell us about yourself</h2>

                <div class="option-grid">

                    <button class="option-btn gender-btn" data-value="Male" data-i18n="common.male">Male</button>

                    <button class="option-btn gender-btn" data-value="Female" data-i18n="common.female">Female</button>

                    <button class="option-btn gender-btn" data-value="Other" data-i18n="common.other">Other</button>

                    <button class="option-btn gender-btn" data-value="no" data-i18n="onboarding.preferNotToSay">Prefer
                        not to say</button>

                </div>

                <select id="ageRange">

                    <option value="no" selected data-i18n="onboarding.selectAgeRange">Select Age Range / Prefer not
                        to say</option>

                    <option value="13-17">13 - 17</option>
                    <option value="18-24">18 - 24</option>
                    <option value="25-34">25 - 34</option>
                    <option value="35-44">35 - 44</option>
                    <option value="45-54">45 - 54</option>
                    <option value="55+">55+</option>

                </select>

            </div>

            <!-- STEP 2 -->
            <div class="step" id="step-2">

                <h2 data-i18n="onboarding.yourFinances">Your finances</h2>

                <select id="currency">
                    <option value="USD" selected data-i18n="labels.baseCurrency">Base Currency</option>
                    <option id="USD" value="USD" data-i18n="currencies.USD">USD - US Dollar</option>
                    <option id="AUD" value="AUD" data-i18n="currencies.AUD">AUD - Australian Dollar</option>
                    <option id="CAD" value="CAD" data-i18n="currencies.CAD">CAD - Canadian Dollar</option>
                    <option id="CHF" value="CHF" data-i18n="currencies.CHF">CHF - Swiss Franc</option>
                    <option id="CNY" value="CNY" data-i18n="currencies.CNY">CNY - Chinese Yuan</option>
                    <option id="EUR" value="EUR" data-i18n="currencies.EUR">EUR - Euro</option>
                    <option id="GBP" value="GBP" data-i18n="currencies.GBP">GBP - British Pound</option>
                    <option id="JPY" value="JPY" data-i18n="currencies.JPY">JPY - Japanese Yen</option>
                    <option id="KRW" value="KRW" data-i18n="currencies.KRW">KRW - Korean Won</option>
                    <option id="MXN" value="MXN" data-i18n="currencies.MXN">MXN - Mexican Peso</option>
                    <option id="NZD" value="NZD" data-i18n="currencies.NZD">NZD - New Zealand Dollar</option>
                    <option id="SEK" value="SEK" data-i18n="currencies.SEK">SEK - Swedish Krona</option>
                </select>

                <select id="incomeFrequency">

                    <option value="no" selected data-i18n="onboarding.incomeFrequency">Income frequency / Prefer not
                        to say</option>

                    <option value="Weekly" data-i18n="common.weekly">Weekly</option>
                    <option value="Biweekly" data-i18n="common.biweekly">Biweekly</option>
                    <option value="Monthly" data-i18n="common.monthly">Monthly</option>

                </select>



                <input type="number" id="currentBalance" placeholder="Current balance"
                    data-i18n-placeholder="placeholders.currentBalance">



            </div>

            <!-- STEP 3 -->
            <div class="step" id="step-3">

                <h2 data-i18n="onboarding.yourFinancialGoal">Your financial goal</h2>

                <div class="option-grid">

                    <button class="option-btn goal-btn" data-value="Save Money" data-i18n="common.saveMoney">Save
                        Money</button>

                    <button class="option-btn goal-btn" data-value="Track Expenses"
                        data-i18n="common.trackExpenses">Track Expenses</button>

                    <button class="option-btn goal-btn" data-value="Reduce Debt" data-i18n="common.reduceDebt">Reduce
                        Debt</button>

                    <button class="option-btn goal-btn" data-value="Improve Habits"
                        data-i18n="common.improveHabits">Improve Habits</button>

                    <button class="option-btn goal-btn" data-value="Other" data-i18n="common.other">Other</button>

                    <button class="option-btn goal-btn" data-value="no" data-i18n="onboarding.preferNotToSay">Prefer
                        not to say</button>

                </div>

            </div>

            <!-- STEP 4 -->
            <div class="step" id="step-4">

                <div class="finish-container">

                    <h2 data-i18n="onboarding.everythingReady">Everything is ready</h2>

                    <p data-i18n="onboarding.personalized">
                        Seider is now personalized for you.
                    </p>

                    <button id="finishBtn" data-i18n="buttons.goToTimeline">Go To Timeline</button>

                </div>

            </div>

            <!-- NAVIGATION -->
            <div class="navigation">

                <button id="backBtn" class="secondary-btn" data-i18n="common.back">Back</button>

                <button id="nextBtn" data-i18n="buttons.continue">Continue</button>

            </div>

        </div>

    </div>

    <!-- SIDE BUTTONS LEFT -->
    <div class="side-buttons-left">
        <button id="darkModeToggle" class="toggle-btn" data-i18n="common.darkMode">Dark Mode</button>
    </div>
    <script>
        if (localStorage.getItem("darkMode") === "true") {
            document.documentElement.classList.add("dark-mode");
        }
    </script>

    <!-- CUSTOM ALERT/CONFIRM-->
    <div id="customModalOverlay" class="custom-modal-overlay">

        <div class="custom-modal">

            <div class="custom-modal-header">

                <div id="customModalIcon" class="custom-modal-icon">
                    ⚡
                </div>

                <div id="customModalTitle" class="custom-modal-title">
                    Alert
                </div>

            </div>

            <div id="customModalMessage" class="custom-modal-message">
                Message here...
            </div>

            <div class="custom-modal-actions">

                <button id="customModalCancel" class="custom-modal-btn cancel">
                    Cancel
                </button>

                <button id="customModalConfirm" class="custom-modal-btn confirm">
                    OK
                </button>

            </div>

        </div>

    </div>



    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <script type="module" src="../JS/onboarding.js"></script>

</body>

</html>
